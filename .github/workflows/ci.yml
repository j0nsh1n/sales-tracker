name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install a virtual display for the tkinter tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        run: xvfb-run -a python -m unittest test_sales_tracker -v

  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build SalesTracker.exe
        run: python -m PyInstaller --noconfirm SalesTracker.spec

      - name: Upload exe
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SalesTracker-windows
          path: dist/SalesTracker.exe
          if-no-files-found: error

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SalesTracker.exe

  linux-elf:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Tk and PyInstaller
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build Linux ELF
        run: python -m PyInstaller --noconfirm SalesTracker.spec

      - name: Name the Linux binary
        run: mv dist/SalesTracker dist/SalesTracker-linux-x86_64

      - name: Upload Linux ELF
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SalesTracker-linux
          path: dist/SalesTracker-linux-x86_64
          if-no-files-found: error

      - name: Attach ELF to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SalesTracker-linux-x86_64
