name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"
  # Run workflow from the Actions tab with a tag name to cut a release
  # without a local git: the tag is created at the chosen commit and the
  # binaries and update.json are attached, the same as pushing the tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create, e.g. v0.2.0 (leave empty for a plain run)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Which release, if any, this run is for: a pushed v* tag, the dispatch
  # input, or, on a push to main, the version in _version.py when no tag
  # for it exists yet. So a version bump landing on main cuts its release
  # by itself, and nothing needs a local git or the Actions tab.
  release-plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide the release tag
        id: plan
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          version="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' salestracker/_version.py)"
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] \
               && ! git ls-remote --exit-code --tags origin "$version" >/dev/null; then
            tag="$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version in code: $version; release tag: ${tag:-none}"

  tests:
    needs: release-plan
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install a virtual display for the tkinter tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        run: xvfb-run -a python -m unittest test_sales_tracker -v

      # The updater compares the manifest's version with __version__, so a
      # release whose tag disagrees with the code would never be offered.
      - name: Check the tag matches __version__
        if: env.RELEASE_TAG != ''
        run: |
          python - <<'EOF'
          import os, sys, salestracker
          tag = os.environ["RELEASE_TAG"].lstrip("v")
          if tag != salestracker.__version__:
              sys.exit(f"tag {tag} does not match __version__ {salestracker.__version__}")
          EOF

  windows-exe:
    needs: [release-plan, tests]
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build SalesTracker.exe
        run: python -m PyInstaller --noconfirm SalesTracker.spec

      # A packaged build can fail in ways the unit suite cannot see, and
      # PyInstaller reports a missing Tcl data directory as a warning while
      # still exiting 0. Launch the thing and require a real window.
      - name: Smoke test the exe
        run: python tools/smoke_test.py --binary dist/SalesTracker.exe

      - name: Upload exe
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SalesTracker-windows
          path: dist/SalesTracker.exe
          if-no-files-found: error

      - name: Attach exe to GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/SalesTracker.exe

  linux-elf:
    needs: [release-plan, tests]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Tk and PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xdotool
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build Linux ELF
        run: python -m PyInstaller --noconfirm SalesTracker.spec

      # Same check as the Windows job, on a virtual display. xdotool is what
      # reports the window; without it the harness exits 2 rather than passing.
      - name: Smoke test the ELF
        run: xvfb-run -a python tools/smoke_test.py --binary dist/SalesTracker

      - name: Name the Linux binary
        run: mv dist/SalesTracker dist/SalesTracker-linux-x86_64

      - name: Upload Linux ELF
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SalesTracker-linux
          path: dist/SalesTracker-linux-x86_64
          if-no-files-found: error

      - name: Attach ELF to GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/SalesTracker-linux-x86_64

  # The update manifest: what the app's updater reads. It needs both
  # binaries' checksums, so it runs after the two builds.
  release-manifest:
    if: needs.release-plan.outputs.tag != ''
    needs: [release-plan, windows-exe, linux-elf]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v4
        with:
          name: SalesTracker-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: SalesTracker-linux
          path: dist

      - name: Write update.json
        run: |
          python -m salestracker.update write-manifest \
            --version "$RELEASE_TAG" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/" \
            --notes-from CHANGELOG.md \
            dist/SalesTracker.exe dist/SalesTracker-linux-x86_64 > update.json
          cat update.json

      - name: Attach update.json to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: update.json
