name: Build Windows exe

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build SalesTracker.exe
        run: python -m PyInstaller --noconfirm SalesTracker.spec

      - name: Upload exe
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SalesTracker-windows
          path: dist/SalesTracker.exe
          if-no-files-found: error
